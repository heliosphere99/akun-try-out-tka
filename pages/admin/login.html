<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Try Out TKA</title>
    
    <!-- Font Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    colors: {
                        neutron: {
                            50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800 relative overflow-hidden">

    <!-- Ornamen Background (Opsional untuk UI memukau) -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-neutron-500/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-400/10 rounded-full blur-3xl"></div>

    <!-- Login Card -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden relative z-10 animate-[fadeIn_0.5s_ease-out]">
        
        <!-- Bagian Header (Biru) -->
        <div class="bg-gradient-to-br from-neutron-600 to-neutron-700 px-6 py-10 text-center relative">
            <!-- Logo Asli -->
            <img src="assets/img/logo.png" alt="Logo Neutron" class="w-10 h-10 object-contain">
            <h2 class="text-2xl font-bold text-white tracking-wide">Admin Panel</h2>
            <p class="text-neutron-100 text-sm mt-1 font-medium">Sistem Akun Try Out TKA</p>
            
            <!-- Curve SVG di bagian bawah header -->
            <svg class="absolute bottom-0 left-0 w-full text-white" viewBox="0 0 1440 120" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 120L1440 120L1440 40.5C1080 -25.5 360 85.5 0 20.5L0 120Z"></path>
            </svg>
        </div>
        
        <!-- Bagian Form -->
        <div class="p-8 pt-6">
            <form id="form-login" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1 ml-1">Username</label>
                    <div class="relative group">
                        <input type="text" id="username" required autocomplete="off" placeholder="Masukkan username" 
                            class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-neutron-500 focus:ring-4 focus:ring-neutron-100 outline-none transition-all font-semibold text-slate-700">
                        <svg class="w-5 h-5 text-slate-400 absolute left-4 top-4 group-focus-within:text-neutron-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1 ml-1">Password</label>
                    <div class="relative group">
                        <input type="password" id="password" required placeholder="Masukkan password" 
                            class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-neutron-500 focus:ring-4 focus:ring-neutron-100 outline-none transition-all font-semibold text-slate-700">
                        <svg class="w-5 h-5 text-slate-400 absolute left-4 top-4 group-focus-within:text-neutron-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-neutron-600 hover:bg-neutron-700 text-white font-bold py-3.5 rounded-xl transition-all duration-300 shadow-lg shadow-neutron-500/30 hover:shadow-neutron-500/50 hover:-translate-y-0.5 flex justify-center items-center gap-2 mt-4">
                    MASUK SISTEM
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>
            
            <div class="mt-8 text-center">
                <a href="../../index.html" class="text-sm text-slate-400 hover:text-neutron-600 font-semibold transition-colors flex justify-center items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Kembali ke Halaman Publik
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/admin.js"></script>
</body>
</html>
